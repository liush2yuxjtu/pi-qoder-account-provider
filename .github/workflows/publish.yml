name: Publish

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.repository == 'liush2yuxjtu/pi-qoder-account-provider'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install --global npm@latest
      - run: npm ci
      - run: npm run check
      - name: Publish target version once
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test "$VERSION" = "0.1.1"
          if npm view "pi-qoder-account-provider@$VERSION" version >/dev/null 2>&1; then
            echo "pi-qoder-account-provider@$VERSION already exists; skipping"
            exit 0
          fi
          npm publish --access public --provenance
